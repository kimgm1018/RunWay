plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.runway'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // W07 payloadHash: RFC 8785 JSON Canonicalization Scheme reference implementation.
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    // ADR-0019: local Copernicus GLO-30 GeoTIFF, pure Java reader.
    implementation 'mil.nga:tiff:3.0.0'
    // ADR-0025: FCM HTTP v1 push. Firestore·Storage clients are unused, so their transitive SDKs are left out.
    implementation('com.google.firebase:firebase-admin:9.11.0') {
        exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
        exclude group: 'com.google.cloud', module: 'google-cloud-storage'
    }
    // FirebaseOptions references the Jackson2 JSON factory, which normally arrives through the excluded Firestore client.
    // Same version as the google-http-client that firebase-admin resolves.
    implementation 'com.google.http-client:google-http-client-jackson2:2.2.0'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'password-performance'
    }
    maxHeapSize = '1536m'
    // 테스트 JVM 2개가 클래스를 나눠 실행한다. JVM마다 PostGIS·Redis 서버를 따로 띄우므로 DB를 함께 쓰지 않는다(S15P31E105-431).
    maxParallelForks = 2
}

// CI는 --build-cache로 컴파일 결과만 재사용한다. 테스트 결과는 캐시에서 가져오지 않고 DB 통합 테스트를 매번 실제로 실행한다(S15P31E105-668).
tasks.withType(Test).configureEach {
    outputs.doNotCacheIf('DB 통합 테스트는 매 실행 실제로 수행한다') { true }
}

tasks.register('passwordPerformanceTest', Test) {
    group = 'verification'
    description = 'Runs password cost measurements explicitly on a controlled host.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'password-performance'
    }
    maxHeapSize = '1536m'
}

tasks.named('jar') {
    enabled = false
}
