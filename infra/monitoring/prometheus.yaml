global:
  scrape_interval: 30s

scrape_configs:
  - job_name: ec2
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: backend-https
    metrics_path: /probe
    params:
      module: [backend_https]
    static_configs:
      - targets: ["https://k15e105.p.ssafy.io/backend-probe"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
