# Synthetic test-only key; never use in a running service.
runway.security.jwt-secret-base64=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
runway.security.docs-access-mode=local
server.address=127.0.0.1
management.server.port=0
# Synthetic connection settings; tests using Redis replace the endpoint with an isolated container.
runway.auth.redis.host=127.0.0.1
runway.auth.redis.port=6379
runway.auth.redis.username=runway_test
runway.auth.redis.password=synthetic-redis-test-only
runway.auth.redis.ssl-enabled=false
# Background filesystem cleanup must never run against a developer's default image volume.
runway.images.cleanup-enabled=false
# Test environment only (users.md U15, S15P31E105-560): signup without a phone verification proof.
# Tests that check the production rule switch SignupSettings off and restore it.
runway.auth.signup.unverified-phone-allowed=true
# Course basemap startup backfill (S15P31E105-612) must not call Route from shared test contexts.
runway.course-basemap.backfill-on-startup=false
# Group pace km ratio backfill (S15P31E105-817) must not run in shared test contexts; tests call it explicitly.
runway.group-pace.backfill-on-startup=false
# Daily readiness evaluation (S15P31E105-836) must not run on a timer in shared test contexts; tests call it explicitly.
runway.readiness.daily-evaluation-enabled=false
runway.readiness.push-enabled=false
