<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunWay 코스 추천</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/runway.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <span class="logo">RunWay</span>
      <span class="tagline">오늘 달릴 코스를 새로 만들어 추천해요</span>
    </header>

    <section class="card">
      <h2>출발 위치</h2>
      <div id="start-text" class="start-text">기본 위치를 불러오는 중…</div>
      <div class="row">
        <button id="btn-default" class="chip" type="button">기본 위치</button>
        <button id="btn-geo" class="chip" type="button">내 위치</button>
      </div>
      <p class="hint">지도를 눌러 출발 위치를 바꿀 수 있어요.</p>
      <div class="quick"><span class="hint">예시 출발지</span><span id="quick"></span></div>
    </section>

    <section class="card">
      <h2>코스 형태</h2>
      <div class="seg" id="shape">
        <button type="button" data-shape="loop" class="on">순환</button>
        <button type="button" data-shape="out_and_back">왕복</button>
        <button type="button" data-shape="point_to_point">편도</button>
      </div>
      <p id="shape-hint" class="hint">출발점으로 돌아오는 순환 코스예요.</p>
      <div id="end-row" class="end-row" hidden>
        <h3>도착 위치</h3>
        <div id="end-text" class="start-text">도착 위치를 아직 고르지 않았어요.</div>
        <div class="row pick-row">
          <span class="hint">지도를 누르면</span>
          <div class="seg seg-sm" id="click-target">
            <button type="button" data-target="start">출발 바꾸기</button>
            <button type="button" data-target="end" class="on">도착 정하기</button>
          </div>
          <button id="btn-end-clear" class="chip small" type="button">도착 지우기</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>목표 거리</h2>
      <div class="seg" id="dist">
        <button type="button" data-km="3">3 km</button>
        <button type="button" data-km="5" class="on">5 km</button>
        <button type="button" data-km="10">10 km</button>
        <label class="custom"><input id="dist-custom" type="number" min="1" max="15" step="0.5" placeholder="직접" aria-label="직접 입력 (km)"><span>km</span></label>
      </div>
    </section>

    <section class="card">
      <h2>원하는 조건 <span class="hint">체크한 것만 반영해요</span></h2>
      <h3>환경</h3>
      <div class="toggles">
        <label class="tog"><input type="checkbox" data-f="river"><span>강변 · 하천</span></label>
        <label class="tog"><input type="checkbox" data-f="beach"><span>해변 · 바다</span></label>
        <label class="tog"><input type="checkbox" data-f="park"><span>공원 · 녹지</span></label>
        <label class="tog"><input type="checkbox" data-f="trail"><span>트레일 · 산책로</span></label>
      </div>
      <h3>도로</h3>
      <div class="toggles">
        <label class="tog"><input type="checkbox" data-f="pedestrian"><span>보행로 위주</span></label>
        <label class="tog"><input type="checkbox" data-f="avoid_major_road"><span>큰길 피하기</span></label>
        <label class="tog"><input type="checkbox" data-f="avoid_steps"><span>계단 피하기</span></label>
        <label class="tog"><input type="checkbox" data-f="avoid_tunnel"><span>터널 피하기</span></label>
      </div>
      <h3>난이도</h3>
      <div class="toggles">
        <label class="tog"><input type="checkbox" data-f="flat"><span>평지 위주</span></label>
      </div>
      <p class="hint">체크하지 않은 조건은 신경 쓰지 않아요. 예를 들어 해변을 끄면 해변을 피하는 게 아니라 상관하지 않아요.</p>
    </section>

    <button id="btn-go" class="primary" type="button" disabled>코스 추천받기</button>
    <div id="busy" class="busy" hidden></div>
    <div id="error" class="error" hidden></div>

    <section id="results" hidden>
      <div class="res-head">
        <h2>추천 코스 TOP 3</h2>
        <button id="btn-regen" class="ghost" type="button">다른 코스 추천</button>
      </div>
      <div id="gen-info" class="gen-info"></div>
      <div id="notices"></div>
      <div id="cards"></div>
    </section>

    <details id="debug">
      <summary>디버그 보기</summary>
      <label class="dbg-row"><input type="checkbox" id="dbg-network"> 도로망 상태 (RUNNABLE / EXCLUDED / UNCERTAIN)</label>
      <label class="dbg-row"><input type="checkbox" id="dbg-extent"> 환경 데이터 범위</label>
      <pre id="dbg-json">아직 요청이 없어요.</pre>
    </details>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="route-tabs" class="route-tabs" hidden></div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/runway.js"></script>
</body>
</html>
