<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunWay 워치 화면</title>
  <!-- 워치 앱과 같은 한글 글꼴(Noto Sans KR). 숫자는 워치 앱의 Rajdhani를 함께 싣는다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="watch.css?v=767b">
  <script defer src="../js/logic.js?v=912"></script>
  <script defer src="../js/stream.js?v=900"></script>
  <script defer src="../js/standings.js?v=767b"></script>
  <script defer src="watch-logic.js?v=912"></script>
  <script defer src="watch.js?v=912"></script>
</head>
<body>
  <main class="stage">
    <div id="face" class="face" data-page="status" aria-live="polite">
      <svg id="face-art" class="face-art" viewBox="0 0 454 454" aria-hidden="true"></svg>
      <div id="content" class="content"></div>
      <div id="bottom-button" class="bottom-button hidden"><span>직접 조절</span></div>
      <div class="handle" aria-hidden="true"><i></i><i></i></div>
    </div>
    <p id="conn" class="conn">연결 대기</p>
    <form id="auth" class="auth hidden">
      <label for="token">시연 보기 토큰</label>
      <input id="token" type="password" autocomplete="off" placeholder="토큰을 입력하세요">
      <button type="submit">연결</button>
    </form>
  </main>
</body>
</html>
