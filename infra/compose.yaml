name: runway

services:
  nginx:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ../frontend/landing:/usr/share/nginx/landing:ro
    networks:
      - service
      - jenkins
      - monitoring-proxy

networks:
  monitoring-proxy:
    external: true
    name: runway_monitoring_proxy
  service:
    driver: bridge
  jenkins:
    external: true
    name: runway-ci_default
