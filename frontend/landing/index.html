  .mark {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 15%;
    transform: translate(-50%, -50%);
    color: var(--mark);
  }
  .mark svg { display: block; width: 100%; height: auto; }
  .credits {
    position: absolute;
    left: var(--gutter);
    right: var(--gutter);
    top: 88%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-size: clamp(12px, 1.25vw, 18px);
    line-height: 1.25;
  }
  .credits div { display: flex; gap: .4em; white-space: nowrap; }
  .credits .logo { display: block; height: .81em; width: auto; }
  .credits dt { font-weight: 300; }
  .credits dd { font-weight: 500; }
  .credits div:last-child { justify-content: flex-end; }

  /* 2 · 시작: 스크롤할수록 화면 전체에 유리 흐림이 서서히 깔린다 */
  .start { height: 100vh; height: 100svh; }
  .glass {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    backdrop-filter: blur(28px) saturate(140%);
    opacity: 0;
    pointer-events: none;
  }
  .glass.is-in { pointer-events: auto; }
  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: .75em;
    color: #FFFFFF;
    font-size: clamp(18px, 1.6vw, 24px);
    font-weight: 500;
    text-decoration: none;
  }
