name: runway-backend

services:
  backend:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      BACKEND_DB_URL: jdbc:postgresql://db:5432/runway
      BACKEND_DB_USERNAME: runway_app
      BACKEND_BIND_ADDRESS: 0.0.0.0
      BACKEND_PORT: "8080"
      # EC2 runway_service의 내부 대역. Nginx·백엔드만 연결하며 네트워크 재생성 시 확인한다.
      BACKEND_AUTH_TRUSTED_PROXIES: 172.18.0.0/16
      BACKEND_IMAGE_VOLUME_PATH: /data/images
      BACKEND_REDIS_HOST: redis
      BACKEND_REDIS_PORT: "6379"
      BACKEND_REDIS_USERNAME: runway_app
      BACKEND_REDIS_SSL_ENABLED: "false"
      BACKEND_ROUTE_MODE: http
      BACKEND_ROUTE_BASE_URL: http://route:8000
      BACKEND_DOCS_ACCESS_MODE: password
      BACKEND_DOCS_USERNAME: runway105
      # HR 추론 AI 서버(runway-ai 내부 네트워크의 ai 서비스). AI04 실시간 코칭(421)과 AI06 개인화(410)가 함께 쓴다.
      BACKEND_AI_BASE_URL: http://ai:8000
      # C01 경사 계산 DEM(S15P31E105-568). Route CD가 SHA 검증 후 준비한 번들 v2의 같은 파일을 읽기 전용으로 연결한다.
      # Route 데이터 revision을 바꾸면 아래 마운트 경로와 SHA를 함께 바꾼다. 불일치 시 C01만 503 GRADE_NOT_READY다.
      BACKEND_COURSE_DEM_PATH: /data/dem/copernicus_glo30_canonical_clip.tif
      BACKEND_COURSE_DEM_SHA256: 45faaa5e36c710a235658e1172183279007ac3b3fdcc29a14246222fdabb3a1f
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export BACKEND_DB_PASSWORD="$$(cat /run/secrets/db_app_password)"
        export BACKEND_JWT_SECRET_BASE64="$$(cat /run/secrets/jwt_secret_base64)"
        export BACKEND_DOCS_PASSWORD_HASH="$$(cat /run/secrets/docs_password_hash)"
        export BACKEND_REDIS_PASSWORD="$$(cat /run/secrets/redis_app_password)"
        exec java -jar /app/app.jar
    volumes:
      - type: bind
        source: /home/ubuntu/runway/data/images
        target: /data/images
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/data/route-bundles/4952478476ce2d76579e1b6ba16363214e6a6914/reports/_route_canonical_work/dem/copernicus_glo30_canonical_clip.tif
        target: /data/dem/copernicus_glo30_canonical_clip.tif
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/redis-app-password
        target: /run/secrets/redis_app_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/db-app-password
        target: /run/secrets/db_app_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/jwt-secret-base64
        target: /run/secrets/jwt_secret_base64
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/docs-password-hash
        target: /run/secrets/docs_password_hash
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - route
      - redis
      - database
      - service
      - ai

networks:
  route:
    external: true
    name: runway-route_default
  redis:
    external: true
    name: runway_redis
  database:
    external: true
    name: runway-db_default
  service:
    external: true
    name: runway_service
  # AI 서버의 외부 포트 없는 내부 네트워크(infra/ai/compose.yaml). AI Compose를 먼저 실행해 네트워크를 만든다.
  ai:
    external: true
    name: runway-ai_default
