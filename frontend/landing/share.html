<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RunWay 경로 재생</title>
<meta property="og:title" content="RunWay 경로 재생">
<meta property="og:description" content="RunWay에서 함께 뛴 길을 확인해 보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<!-- S15P31E105-704 경로 재생 링크의 웹 화면. 앱이 설치된 Android 폰은 App Links로 앱이 열리고, 그 밖에서는 이 페이지가
     /r/{token}의 경로를 네이버 지도 위에서 재생한다. /p/{postId}는 로그인이 필요해 앱 안내만 한다.
     네이버 지도 클라이언트 ID는 저장소에 두지 않고 배포 때 __NAVER_MAP_CLIENT_ID__를 바꾼다(infra/README.md). -->
<style>
  :root {
    --ground: #14171C;
    --ink: #4DFFD2;
    --ribbon: #B3FFEC;
    --text: #FFFFFF;
    --muted: #9299A4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text);
    font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased; }
  /* NAVER MapView sets inline position:relative. Keep a viewport-sized map even after that change. */
  #map { position: fixed; inset: 0; width: 100%; height: 100%; }
  .shade { position: fixed; left: 0; right: 0; pointer-events: none; }
  .shade.top { top: 0; height: 160px; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .shade.foot { bottom: 0; height: 55%; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.92)); }
  header { position: fixed; top: 0; left: 0; right: 0; padding: max(16px, env(safe-area-inset-top)) 20px 0; }
  .brand { font-weight: 800; letter-spacing: .02em; color: var(--ink); font-size: 14px; }
  h1 { margin: 6px 0 2px; font-size: 22px; font-weight: 800; line-height: 1.25; }
  .byline { color: var(--muted); font-size: 14px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px max(20px, env(safe-area-inset-bottom)); }
  .pace { font-size: 56px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-top: 4px; }
  .row { display: flex; gap: 12px; margin-top: 18px; }
  .cell { flex: 1; }
  .cell b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cell span { color: var(--muted); font-size: 12px; font-weight: 700; }
  .track { height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; margin-top: 18px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--ink); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions a { flex: 1; text-align: center; text-decoration: none; font-weight: 800; font-size: 15px;
    padding: 14px 8px; border-radius: 12px; }
  .primary { background: var(--ink); color: #0B1F19; }
  .secondary { background: #2A2F36; color: var(--text); }
  .runner-pin { width: 52px; height: 76px; position: relative; pointer-events: none; }
  .runner-head { width: 52px; height: 52px; padding: 4px; border-radius: 50%; background: #fff; position: relative; }
  .runner-avatar, .runner-letter { width: 44px; height: 44px; border-radius: 50%; }
  .runner-avatar { display: block; object-fit: cover; }
  .runner-avatar[hidden], .runner-letter[hidden] { display: none; }
  .runner-letter { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px;
    font-weight: 800; background: linear-gradient(#8DACBA, #5D8194); }
  .runner-tip { margin: 0 auto; width: 0; height: 0; border-left: 7px solid transparent;
    border-right: 7px solid transparent; border-top: 8px solid #fff; }
  .runner-dot { margin: 2px auto 0; width: 14px; height: 8px; border: 1.5px solid #fff; border-radius: 4px; background: var(--ink); }
  .runner-fixed { position: fixed; left: 50%; top: 42%; transform: translate(-26px, -66px); z-index: 10; pointer-events: none; }
  .runner-fixed[hidden] { display: none; }
  .runner-fixed.playing::before { content: ''; position: absolute; left: 12px; top: 52px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--ink); animation: runnerPulse 1400ms ease-out infinite; }
  @keyframes runnerPulse { from { transform: scale(.6); opacity: .55; } to { transform: scale(2.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .runner-fixed.playing::before { animation: none; opacity: 0; } }
  .notice { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center;
    padding: 0 28px; text-align: left; }
  .notice h1 { font-size: 24px; }
  .notice p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 10px 0 0; }
  body.noticed .notice { display: flex; }
  body.noticed #map, body.noticed .shade, body.noticed header, body.noticed footer { display: none; }
  body.loading footer, body.loading header h1 { visibility: hidden; }
</style>
</head>
<body class="loading">
<div id="map" aria-hidden="true"></div>
<div class="shade top"></div>
<div class="shade foot"></div>
<div id="runnerFixed" class="runner-fixed" hidden></div>
<header>
  <div class="brand">RunWay 경로 재생</div>
  <h1 id="title">&nbsp;</h1>
  <div class="byline" id="byline"></div>
</header>
<footer>
  <div class="pace" id="pace">–</div>
  <div class="unit">평균 페이스 (/KM)</div>
  <div class="row">
    <div class="cell"><b id="km">0.00</b><span>거리 (KM)</span></div>
    <div class="cell"><b id="time">0:00</b><span>시간</span></div>
    <div class="cell"><b id="steps">–</b><span>걸음</span></div>
  </div>
  <div class="track" role="progressbar" aria-label="재생 진행" aria-valuemin="0" aria-valuemax="100">
    <div class="fill" id="fill"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="actions">
    <a class="primary" id="openApp" href="#">앱에서 열기</a>
    <a class="secondary" href="/">랜딩페이지로 이동</a>
  </div>
</footer>
<section class="notice" role="alert">
  <div class="brand">RunWay</div>
  <h1 id="noticeTitle">RunWay 앱에서 열어 주세요</h1>
  <p id="noticeText">이 링크는 RunWay 앱에서 볼 수 있어요. 앱이 설치되어 있다면 아래 버튼을 눌러 주세요.</p>
  <div class="actions">
    <a class="primary" id="noticeOpen" href="#">앱에서 열기</a>
    <a class="secondary" href="/">랜딩페이지로 이동</a>
  </div>
</section>
<script>
(function () {
  'use strict';
  var clientId = '__NAVER_MAP_CLIENT_ID__';
  var path = location.pathname.replace(/\/+$/, '');
  var run = /^\/r\/([A-Za-z0-9_-]{43})$/.exec(path);
  var post = /^\/p\/([A-Za-z0-9_-]{1,64})$/.exec(path);
  // 앱에서 열기: the same https link through Android's intent, so an installed app opens it even where App Links
  // were not verified; elsewhere it stays on this page.
  var here = location.href.split('#')[0];
  var intent = 'intent://' + location.host + path +
    '#Intent;scheme=https;package=com.runway.health;S.browser_fallback_url=' + encodeURIComponent(here) + ';end';
  var isAndroid = /Android/i.test(navigator.userAgent);
  ['openApp', 'noticeOpen'].forEach(function (id) {
    document.getElementById(id).href = isAndroid ? intent : here;
  });

  function notice(title, text) {
    document.getElementById('noticeTitle').textContent = title;
    document.getElementById('noticeText').textContent = text;
    document.body.classList.remove('loading');
    document.body.classList.add('noticed');
  }
  if (post) {
    notice('RunWay 앱에서 열어 주세요', '게시물의 코스 재생은 RunWay 앱에 로그인해서 볼 수 있어요.');
    return;
  }
  if (!run) {
    notice('열 수 없는 링크예요', '링크 주소를 다시 확인해 주세요.');
    return;
  }

  function pace(sec) {
    if (sec === null || !isFinite(sec)) return '–';
    var s = Math.round(sec);
    return Math.floor(s / 60) + '′' + String(s % 60).padStart(2, '0') + '″';
  }
  function clock(sec) {
    var s = Math.floor(sec), m = Math.floor(s / 60), r = s % 60;
    return r ? m + 'm ' + r + 's' : m + 'm';
  }
  function stamp(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Seoul' });
  }
  // Metres between two [lng, lat] points.
  function metres(a, b) {
    var rad = Math.PI / 180, dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }
  // Same display-only filtering as the community's calmRunPart: each measured part stays separate.
  function calmPart(part) {
    var kept = [];
    part.forEach(function (point, index) {
      var before = kept[kept.length - 1], after = part[index + 1];
      if (before && after) {
        var out = metres(before, point), back = metres(point, after);
        if (out > 20 && back > 20 && metres(before, after) < Math.min(out, back) * 0.5) return;
      }
      kept.push(point);
    });
    return kept.map(function (point, index) {
      if (!index || index === kept.length - 1) return point;
      var reach = Math.min(2, index, kept.length - 1 - index), lng = 0, lat = 0;
      for (var at = index - reach; at <= index + reach; at++) {
        lng += kept[at][0]; lat += kept[at][1];
      }
      return [lng / (reach * 2 + 1), lat / (reach * 2 + 1)];
    });
  }

  // The map's key is checked after its script has loaded, so a failed check can come later than the load.
  var replayStage = '지도 불러오기';
  function mapFailed(error) {
    window.runwayShareReplayError = { stage: replayStage, type: error && error.name || 'Error' };
    document.getElementById('map').style.visibility = 'hidden';
    document.getElementById('hint').textContent = '지도를 준비하지 못했어요 · ' + replayStage;
  }
  function loadMap() {
    return new Promise(function (resolve, reject) {
      window.navermap_authFailure = function () { mapFailed(); reject(new Error('auth')); };
      window.runwayShareMapReady = function () {
        if (window.naver && naver.maps) resolve(); else reject(new Error('load'));
      };
      var script = document.createElement('script');
      script.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(clientId) +
        '&submodules=gl&callback=runwayShareMapReady';
      script.onerror = function () { reject(new Error('load')); };
      document.head.appendChild(script);
    });
  }

  fetch('/api/v1/shared-runs/' + run[1], { headers: { Accept: 'application/json' } })
    .then(function (response) {
      if (response.status === 404) throw new Error('missing');
      if (!response.ok) throw new Error('server');
      return response.json();
    })
    .then(function (data) {
      document.title = data.title + ' · RunWay 경로 재생';
      document.getElementById('title').textContent = data.title;
      document.getElementById('byline').textContent =
        data.runner.nickname + ' · ' + stamp(data.startedAt);
      document.getElementById('pace').textContent = pace(data.averagePaceSecPerKm);
      document.body.classList.remove('loading');
      var parts = (data.segments || [])
        .map(function (segment) { return segment.coordinates || []; })
        .filter(function (part) { return part.length >= 2; });
      var counters = function (shown) {
        document.getElementById('km').textContent = ((data.distanceM || 0) * shown / 1000).toFixed(2);
        document.getElementById('time').textContent = clock((data.durationSec || 0) * shown);
        document.getElementById('steps').textContent = data.cadence == null ? '–' :
          String(Math.round(data.cadence * (data.durationSec || 0) * shown / 60));
        document.getElementById('fill').style.width = Math.round(shown * 100) + '%';
      };
      counters(parts.length ? 0 : 1);
      if (!parts.length) {
        document.getElementById('hint').textContent = '이 러닝은 경로 기록이 없어요';
        return;
      }
      return loadMap().then(function () {
        play(parts, counters, data.distanceM || 0, data.runner);
      }).catch(mapFailed);
    })
    .catch(function (error) {
      if (error && error.message === 'missing') {
        notice('열 수 없는 기록이에요', '링크가 만료됐거나 기록이 삭제됐어요.');
      } else {
        notice('기록을 불러오지 못했어요', '연결을 확인하고 잠시 후 다시 열어 주세요.');
      }
    });

  // The community replay timeline: whole route, a 60-degree swoop, following run, then the whole route again.
  function play(parts, counters, distanceM, runner) {
    parts = parts.map(calmPart);
    var lengths = parts.map(function (part) {
      var legs = [0];
      for (var i = 1; i < part.length; i++) legs.push(legs[i - 1] + metres(part[i - 1], part[i]));
      return legs;
    });
    var total = lengths.reduce(function (sum, legs) { return sum + legs[legs.length - 1]; }, 0) || 1;
    var first = parts[0][0], last = parts[parts.length - 1][parts[parts.length - 1].length - 1];
    var latLng = function (p) { return new naver.maps.LatLng(p[1], p[0]); };
    var nativeParts = parts.map(function (part) { return part.map(latLng); }), pathKeys = [];
    var bounds = new naver.maps.LatLngBounds(latLng(first), latLng(first));
    parts.forEach(function (part) { part.forEach(function (p) { bounds.extend(latLng(p)); }); });
    replayStage = '지도 생성';
    var map = new naver.maps.Map('map', {
      gl: true, tilt: 0, rotation: 0, center: bounds.getCenter(), zoom: 15,
      mapTypeId: naver.maps.MapTypeId.NORMAL,
      draggable: false, pinchZoom: false, scrollWheel: false, keyboardShortcuts: false,
      disableDoubleTapZoom: true, disableDoubleClickZoom: true, disableRotateTilt: true,
      logoControl: true, logoControlOptions: { position: naver.maps.Position.TOP_RIGHT },
      mapDataControl: false, scaleControl: false, zoomControl: false
    });
    var routeStyle = [
      { color: '#003A2C', width: 18 }, { color: '#00785A', width: 12.2 },
      { color: '#B3FFEC', width: 9.3 }, { color: '#4DFFD2', width: 6.9 }
    ];
    var layers = [], marker = null;
    function createOverlays() {
      replayStage = '경로선 준비';
      layers = parts.map(function () {
      return routeStyle.map(function (layer, index) {
        return new naver.maps.Polyline({ map: map, path: [], strokeColor: layer.color,
          strokeWeight: layer.width, strokeOpacity: 1, zIndex: index + 1,
          strokeLineCap: 'round', strokeLineJoin: 'round' });
      });
      });
      replayStage = '프로필 표시';
      fixed.appendChild(makePin()); fixed.hidden = true;
      marker = new naver.maps.Marker({ map: map, position: latLng(first), clickable: false,
        icon: { content: makePin(), size: new naver.maps.Size(52, 76), anchor: new naver.maps.Point(26, 66) } });
    }
    function makePin() {
      var pin = document.createElement('div'); pin.className = 'runner-pin';
      var head = document.createElement('div'); head.className = 'runner-head';
      var letter = document.createElement('span'); letter.className = 'runner-letter';
      letter.textContent = Array.from(String(runner && runner.nickname || '러너'))[0] || 'R';
      head.appendChild(letter);
      var photo = runner && runner.profileImageUrl;
      // Use DOM properties, never interpolate a nickname or photo URL into HTML.
      if (typeof photo === 'string' && (/^https?:\/\//i.test(photo) || /^\/(?!\/)/.test(photo))) {
        var image = document.createElement('img'); image.className = 'runner-avatar';
        image.hidden = true; image.alt = String(runner.nickname || '러너');
        image.onload = function () { letter.hidden = true; image.hidden = false; };
        image.onerror = function () { image.hidden = true; letter.hidden = false; };
        head.appendChild(image); image.src = photo;
      }
      pin.appendChild(head);
      var tip = document.createElement('div'); tip.className = 'runner-tip'; pin.appendChild(tip);
      var point = document.createElement('div'); point.className = 'runner-dot'; pin.appendChild(point);
      return pin;
    }
    var fixed = document.getElementById('runnerFixed');
    var hint = document.getElementById('hint');
    var playMs = Math.round(Math.min(15000, Math.max(8000, 6000 + Math.max(0, distanceM))));
    var phase = 'loading', phaseBegan = null, frame = 0, progress = 0, from = 0;
    var heading = 0, lastCamera = null, hold = 1500, overview = null;
    var initialized = false, drawn = false, initLimit, drawnLimit;
    function engine() {
      return typeof map.getMapbox === 'function' ? map.getMapbox() : null;
    }
    function setHint(message) {
      if (document.getElementById('map').style.visibility === 'hidden') return;
      hint.textContent = message + (engine() ? '' : ' · 입체 지도는 앱에서 볼 수 있어요');
    }
    function pinOnMap(position) {
      fixed.hidden = true; fixed.className = 'runner-fixed';
      marker.setPosition(latLng(position)); marker.setMap(map);
    }
    function pinFollowing(moving) {
      if (!engine()) { pinOnMap(locate(progress).point); return; }
      marker.setMap(null); fixed.hidden = false;
      fixed.className = 'runner-fixed' + (moving ? ' playing' : '');
    }
    function locate(value) {
      if (value >= 1) return { point: last, part: parts.length - 1 };
      var left = total * Math.max(0, value);
      for (var p = 0; p < parts.length; p++) {
        var points = parts[p], legs = lengths[p], length = legs[legs.length - 1];
        if (left <= length) {
          for (var i = 1; i < points.length; i++) {
            if (left <= legs[i]) {
              var share = legs[i] === legs[i - 1] ? 0 : (left - legs[i - 1]) / (legs[i] - legs[i - 1]);
              return { part: p, point: [points[i - 1][0] + (points[i][0] - points[i - 1][0]) * share,
                points[i - 1][1] + (points[i][1] - points[i - 1][1]) * share] };
            }
          }
          return { point: points[0], part: p };
        }
        left -= length;
      }
      return { point: last, part: parts.length - 1 };
    }
    function direction(value) {
      var a = locate(Math.min(value, 0.975)).point, b = locate(Math.min(1, value + 0.025)).point;
      var rad = Math.PI / 180, delta = (b[0] - a[0]) * rad;
      var y = Math.sin(delta) * Math.cos(b[1] * rad);
      var x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) -
        Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos(delta);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }
    function draw(shown, whole) {
      var left = total * shown;
      parts.forEach(function (part, index) {
        var legs = lengths[index], points = [];
        var complete = whole || shown >= 1 || left >= legs[legs.length - 1];
        var key = complete ? 'full' : left <= 0 ? 'empty' : left;
        if (pathKeys[index] === key) { left -= legs[legs.length - 1]; return; }
        pathKeys[index] = key;
        if (complete) {
          points = nativeParts[index];
        } else {
          for (var i = 0; i < part.length; i++) {
            if (legs[i] <= left) { points.push(part[i]); continue; }
            if (i > 0 && left > legs[i - 1]) {
              var t = (left - legs[i - 1]) / (legs[i] - legs[i - 1]);
              points.push([part[i - 1][0] + (part[i][0] - part[i - 1][0]) * t,
                part[i - 1][1] + (part[i][1] - part[i - 1][1]) * t]);
            }
            break;
          }
        }
        left -= legs[legs.length - 1];
        var path = complete ? points : points.length >= 2 ? points.map(latLng) : [];
        layers[index].forEach(function (line) { line.setPath(path); });
      });
      if (fixed.hidden) marker.setPosition(latLng(whole ? first : locate(shown).point));
      counters(shown);
    }
    function margins() {
      return { top: 140, right: 40, bottom: Math.round(window.innerHeight * 0.45), left: 40 };
    }
    function rememberOverview() {
      var gl = engine();
      if (gl && gl.getCenter && gl.getZoom) {
        var center = gl.getCenter();
        overview = { center: [center.lng, center.lat], zoom: gl.getZoom(),
          padding: gl.getPadding ? gl.getPadding() : margins() };
      }
    }
    function showOverview(duration) {
      var gl = engine();
      if (gl && overview) {
        var options = { center: overview.center, zoom: overview.zoom, padding: overview.padding,
          pitch: 0, bearing: 0, duration: duration };
        if (duration) gl.easeTo(options); else gl.jumpTo(options);
      } else {
        map.fitBounds(bounds, margins());
      }
    }
    function follow(point, duration) {
      var gl = engine();
      if (gl && gl.easeTo) {
        var options = { center: point, zoom: 16.6, pitch: 60, bearing: heading, duration: duration,
          padding: { top: 0, right: 0, bottom: Math.round(window.innerHeight * 0.16), left: 0 },
          easing: function (t) { return 1 - Math.pow(1 - t, 3); } };
        // Playback already has a RAF clock. Starting a second 50ms camera animation causes a sawtooth lag.
        if (duration) gl.easeTo(options); else gl.jumpTo(options);
      } else {
        map.morph(latLng(point), 16.6, { duration: duration });
      }
    }
    // A single owned RAF is the only playback clock, even after rapid pause/resume clicks.
    function schedule() {
      if (!frame) frame = requestAnimationFrame(step);
    }
    function stopClock() {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
    }
    function round(restart) {
      stopClock();
      var gl = engine(); if (gl && gl.stop) gl.stop();
      if (restart) showOverview(0);
      phase = 'overview'; phaseBegan = null; progress = 0; from = 0;
      heading = direction(0); lastCamera = null; hold = restart ? 300 : 1500;
      draw(0, true); pinOnMap(first); setHint(''); schedule();
    }
    function step(now) {
      frame = 0;
      if (phaseBegan === null) phaseBegan = now;
      var elapsed = now - phaseBegan;
      if (phase === 'overview' && elapsed >= hold) {
        draw(0, false); follow(first, 2200); phase = 'intro'; phaseBegan = now;
      } else if (phase === 'intro' && elapsed >= 2500) {
        phase = 'playing'; phaseBegan = now; from = 0; lastCamera = now;
        pinFollowing(true);
      } else if (phase === 'playing') {
        progress = Math.min(1, from + elapsed / playMs);
        draw(progress, false);
          var at = locate(progress), target = direction(progress);
          var rate = lastCamera === null ? 0 : 1 - Math.pow(0.78, Math.max(0, now - lastCamera) / 50);
          heading += (((target - heading + 540) % 360) - 180) * rate;
          follow(at.point, 0);
          lastCamera = now;
        if (progress >= 1) {
          phase = 'finish'; phaseBegan = now; pinOnMap(last);
        }
      } else if (phase === 'finish' && elapsed >= 600) {
        showOverview(2400); phase = 'outro'; phaseBegan = now;
      } else if (phase === 'outro' && elapsed >= 2400) {
        phase = 'done'; setHint('탭하면 다시 재생'); return;
      }
      if (phase !== 'paused' && phase !== 'done' && phase !== 'loading') schedule();
    }
    function toggle() {
      if (phase === 'playing') {
        stopClock(); phase = 'paused'; pinFollowing(false);
        var gl = engine(); if (gl && gl.stop) gl.stop();
        setHint('탭하면 계속 재생');
      } else if (phase === 'paused') {
        phase = 'playing'; phaseBegan = null; from = progress; lastCamera = null;
        pinFollowing(true); setHint(''); schedule();
      } else if (phase === 'done' || phase === 'outro' || phase === 'finish') {
        round(true);
      }
    }
    function tilesReady() {
      if (drawn || phase === 'error') return;
      drawn = true; clearTimeout(drawnLimit); rememberOverview(); round(false);
    }
    function initialize() {
      if (initialized) return;
      initialized = true; clearTimeout(initLimit);
      try {
      createOverlays();
      draw(0, true); pinOnMap(first);
      var gl = engine();
      if (gl && gl.once) gl.once('idle', tilesReady);
      else naver.maps.Event.once(map, 'idle', tilesReady);
      drawnLimit = setTimeout(tilesReady, 8000);
      map.fitBounds(bounds, margins());
      if (gl && gl.loaded && gl.loaded()) tilesReady();
      } catch (error) {
        phase = 'error'; stopClock(); clearTimeout(drawnLimit); mapFailed(error);
      }
    }
    replayStage = '재생 준비';
    naver.maps.Event.addListener(map, 'click', toggle);
    naver.maps.Event.once(map, 'init', initialize);
    naver.maps.Event.once(map, 'glReady', initialize);
    function waitForMap() {
      initLimit = setTimeout(function () {
        replayStage = '지도 로딩 지연'; mapFailed(new Error('Map readiness timeout'));
      }, 15000);
    }
    waitForMap();
    if (typeof map.isGLReady === 'function' && map.isGLReady()) initialize();
    window.addEventListener('resize', function () {
      if (phase === 'overview' || phase === 'done') {
        naver.maps.Event.once(map, 'idle', rememberOverview);
        map.fitBounds(bounds, margins());
      } else if (phase === 'playing' || phase === 'paused') {
        follow(locate(progress).point, 0);
      }
    });
    window.addEventListener('pagehide', function () {
      stopClock(); clearTimeout(initLimit); clearTimeout(drawnLimit);
      if (phase === 'playing') {
        phase = 'paused'; pinFollowing(false); setHint('탭하면 계속 재생');
      }
      var gl = engine(); if (gl && gl.stop) gl.stop();
    });
    window.addEventListener('pageshow', function () {
      if (phase === 'error') return;
      if (!initialized) {
        waitForMap();
      } else if (!drawn) {
        drawnLimit = setTimeout(tilesReady, 8000);
      } else if (phase !== 'paused' && phase !== 'done') {
        round(true);
      }
    });
  }
})();
</script>
