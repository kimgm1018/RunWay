name: runway

services:
  nginx:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: /var/lib/runway-monitoring/routes
        target: /etc/nginx/runway-routes
        read_only: true
        bind:
          create_host_path: false
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ../frontend/landing:/usr/share/nginx/landing:ro
    networks:
      - service
      - jenkins
      - monitoring-proxy
      # MPC 시연 콘솔(ai:8000). AI 스택이 만든 외부 네트워크라 AI를 먼저 한 번 배포해야 한다.
      - ai

networks:
  monitoring-proxy:
    external: true
    name: runway_monitoring_proxy
  service:
    driver: bridge
  jenkins:
    external: true
    name: runway-ci_default
  ai:
    external: true
    name: runway-ai_default
