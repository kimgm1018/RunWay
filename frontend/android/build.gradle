buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // S15P31E105-815 (ADR-0025): applied by the app module only when google-services.json is present.
        classpath("com.google.gms:google-services:4.5.0")
    }
}

allprojects {
    repositories {
        // Naver Map SDK is not on Maven Central (ADR-0018).
        maven { url "https://repository.map.naver.com/archive/maven" }
    }
}

// Deep Windows worktree paths can make Ninja regenerate build.ninja indefinitely.
// Keep sources in place (Metro resolves real paths), but shorten CMake's outputs.
if (System.getProperty("os.name").startsWith("Windows")) {
    subprojects { subproject ->
        ["com.android.application", "com.android.library"].each { pluginId ->
            subproject.plugins.withId(pluginId) {
                subproject.extensions.getByName("androidComponents").finalizeDsl { android ->
                    // React Native may assign the app's CMake path in a later callback.
                    def moduleId = java.security.MessageDigest.getInstance("SHA-256")
                        .digest(subproject.projectDir.canonicalPath.getBytes("UTF-8"))
                        .encodeHex().toString().take(16)
                    def nativeRoot = rootProject.findProperty("runwayNativeBuildRoot") ?:
                        new File(System.getProperty("java.io.tmpdir"), "runway-cxx")
                    android.externalNativeBuild.cmake.buildStagingDirectory =
                        new File(nativeRoot.toString(), moduleId)
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
