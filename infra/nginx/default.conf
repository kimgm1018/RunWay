# Docker 내부 DNS로 컨테이너의 바뀐 주소를 다시 조회한다.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream runway_backend {
    zone runway_backend 64k;
    server backend:8080 resolve;
}

upstream runway_jenkins {
    zone runway_jenkins 64k;
    server jenkins:8080 resolve;
}

map $http_upgrade $runway_jenkins_connection {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name k15e105.p.ssafy.io runway.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 공용 모니터링 로그에는 미리 정한 API 경로 패턴만 남긴다.
map $uri $runway_log_route {
    include /etc/nginx/runway-routes/active/nginx.map;
}

log_format runway_monitored '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'runway_route=$runway_log_route runway_seconds=$request_time';

# S15P31E105-704: 공유 기록 토큰은 링크를 가진 누구나 쓰는 열쇠라 접근 로그에 경로 대신 고정 이름만 남긴다.
log_format runway_shared_run '$remote_addr - $remote_user [$time_local] '
    '"$request_method /api/v1/shared-runs/{token} $server_protocol" $status $body_bytes_sent "-" "$http_user_agent" '
    'runway_route=$runway_log_route runway_seconds=$request_time';

server {
    listen 443 ssl;
    server_name k15e105.p.ssafy.io runway.kro.kr;

    ssl_certificate /etc/letsencrypt/live/k15e105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15e105.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # RunWay 소개 랜딩(S15P31E105-587). 루트 정확 일치만 정적 파일로 응답하고 그 밖의 경로는 기존 라우팅을 따른다.
    # 브라우저로 기존 주소의 첫 화면을 열면 발표용 도메인으로 보낸다(S15P31E105-869).
    # 앱·워치 API, 공유 링크, Jenkins 등 다른 경로는 두 도메인 모두에서 그대로 응답한다.
    # 브라우저가 영구 저장하지 않도록 302를 쓴다.
    location = / {
        if ($host = k15e105.p.ssafy.io) {
            return 302 https://runway.kro.kr$request_uri;
        }
        root /usr/share/nginx/landing;
        try_files /index.html =404;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # S15P31E105-704 경로 재생 링크. Android App Links 검증 파일과 /r/{token}·/p/{postId}의 웹 화면.
    # 앱이 설치된 폰은 링크가 앱으로 열리고, 그 밖에서는 share.html이 공유 기록을 보여 준다.
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/landing/.well-known/assetlinks.json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/(r|p)/[A-Za-z0-9_-]{1,64}/?$" {
        root /usr/share/nginx/landing;
        try_files /share.html =404;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # 어디로든 도메인만 보낸다: 경로의 토큰은 다른 사이트에도, 이 서버의 다른 경로(APK·파비콘) 접근 로그에도
        # 남지 않고, 네이버 지도는 Referer의 도메인으로 등록 여부를 확인한다.
        add_header Referrer-Policy "strict-origin" always;
        add_header X-Robots-Tag "noindex" always;
        # 경로가 곧 공유 토큰이라 접근 로그에 남기지 않는다.
        access_log off;
    }

    location = /downloads/runway.apk {
        alias /usr/share/nginx/landing/downloads/runway.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="runway.apk"';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/runway-watch.apk {
        alias /usr/share/nginx/landing/downloads/runway-watch.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="runway-watch.apk"';
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 외부 상태 검사(blackbox)용. 랜딩이 루트를 사용하므로 백엔드 루트의 공개 404 응답을 이 경로로 전달한다.
    location = /backend-probe {
        proxy_pass http://runway_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Team Jenkins UI. Authentication and permissions are enforced by Jenkins.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        set $runway_grafana http://grafana:3000;
        proxy_pass $runway_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $runway_jenkins_connection;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://runway_jenkins;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $runway_jenkins_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /project/runway-repo-check {
        proxy_pass http://runway_jenkins/jenkins/project/runway-repo-check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /project/runway-backend-ci {
        proxy_pass http://runway_jenkins/jenkins/project/runway-backend-ci;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /project/runway-backend-cd {
        proxy_pass http://runway_jenkins/jenkins/project/runway-backend-cd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MPC 시연 콘솔(S15P31E105-648). 페이지는 데이터가 없는 정적 파일이고, 러너 심박은 아래 SSE에서만 나온다.
    # SSE는 AI가 보기 토큰(Bearer)을 검사하므로 기본 인증은 걸지 않는다(S15P31E105-718, 랜딩 Live 메뉴로 진입).
    # AI가 꺼져 있어도 Nginx가 뜨도록 주소는 요청 때 찾는다.
    location = /admin/demo {
        return 301 /admin/demo/;
    }

    location /admin/demo/ {
        set $runway_ai http://ai:8000;
        rewrite ^/admin/demo/(.*)$ /demo/$1 break;
        proxy_pass $runway_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # 콘솔이 부르는 시연 SSE(GET만). Authorization 헤더를 AI 보기 토큰(Bearer)이 쓰므로 기본 인증은 걸 수 없고,
    # AI가 토큰을 검사한다. 시연 기능이 꺼져 있으면 AI가 503 DEMO_DISABLED로 응답한다.
    location ~ ^/v1/demo/sessions/[A-Za-z0-9_-]+/events$ {
        limit_except GET {
            deny all;
        }
        set $runway_ai http://ai:8000;
        proxy_pass $runway_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # S10 러닝 세션 이벤트(SSE). 버퍼링하면 작은 이벤트가 폰에 전달되지 않아 서버 승인 출발·종료·코칭이 멈춘다
    # (S15P31E105-420 실기기 E2E). 앱은 45초 무응답이면 다시 연결하고, 서버는 토큰 만료 전에 스트림을 닫는다.
    location ~ ^/api/v1/running-sessions/[0-9]+/events$ {
        proxy_pass http://runway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # H09 공유 기록 조회(S15P31E105-704): 백엔드 라우팅은 그대로 두고 로그에서만 토큰을 지운다.
    location ^~ /api/v1/shared-runs/ {
        access_log /var/log/nginx/access.log runway_shared_run;
        proxy_pass http://runway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        access_log /var/log/nginx/access.log runway_monitored;
        client_max_body_size 5m;
        proxy_pass http://runway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
