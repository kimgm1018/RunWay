spring:
  application:
    name: runway-backend
  datasource:
    url: ${BACKEND_DB_URL:}
    username: ${BACKEND_DB_USERNAME:}
    password: ${BACKEND_DB_PASSWORD:}
    # DB 장애·잠금 경합 시 무한 대기 대신 정해진 시간 안에 503으로 응답한다(S15P31E105-294).
    # 값은 밀리초 정수다. 근거와 재정의 방법은 backend/README.md 환경변수 표를 따른다.
    hikari:
      connection-timeout: ${BACKEND_DB_CONNECTION_TIMEOUT_MS:5000}
      # HikariCP는 validation-timeout이 connection-timeout보다 작아야 한다.
      validation-timeout: 2000
      data-source-properties:
        # 연결 생성 시 서버 세션 설정으로 적용한다. 트랜잭션의 SET LOCAL lock_timeout이 이 값보다 우선한다.
        options: "-c lock_timeout=${BACKEND_DB_LOCK_TIMEOUT_MS:5000} -c statement_timeout=${BACKEND_DB_STATEMENT_TIMEOUT_MS:10000}"
        # DB 무응답·네트워크 단절 시 서버의 statement_timeout은 전달되지 않으므로 클라이언트 소켓 읽기 상한(초)을 둔다.
        # statement_timeout보다 길게 두어 정상적인 쿼리 시간초과는 서버가 먼저 끊게 한다.
        socketTimeout: ${BACKEND_DB_SOCKET_TIMEOUT_S:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

runway:
  auth:
    trusted-proxies: ${BACKEND_AUTH_TRUSTED_PROXIES:}
    redis:
      host: ${BACKEND_REDIS_HOST:}
      port: ${BACKEND_REDIS_PORT:}
      username: ${BACKEND_REDIS_USERNAME:}
      password: ${BACKEND_REDIS_PASSWORD:}
      ssl-enabled: ${BACKEND_REDIS_SSL_ENABLED:false}
  security:
    jwt-secret-base64: ${BACKEND_JWT_SECRET_BASE64:}
    docs-access-mode: ${BACKEND_DOCS_ACCESS_MODE:password}
    docs-username: ${BACKEND_DOCS_USERNAME:}
    docs-password-hash: ${BACKEND_DOCS_PASSWORD_HASH:}
  images:
    volume-path: ${BACKEND_IMAGE_VOLUME_PATH:data/images}
    max-bytes: 5242880

springdoc:
  swagger-ui:
    persist-authorization: false
