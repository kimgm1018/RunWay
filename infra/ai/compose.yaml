name: runway-ai

services:
  ai:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: ${AI_IMAGE:?AI_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      HR_MODEL_TYPE: gru
      HR_MODEL_PATH: /models/gru_final.pt
      HR_MODEL_SHA256: ${HR_MODEL_SHA256:?HR_MODEL_SHA256 is required}
      HR_DEVICE: cpu
      TORCH_NUM_THREADS: "1"
      # 비우면 ODE 파일을 찾지 않아 GRU 전용으로 동작한다.
      ODEV21_CHECKPOINT_PATH: ${ODEV21_CHECKPOINT_PATH:-}
      ODEV21_CHECKPOINT_SHA256: ${ODEV21_CHECKPOINT_SHA256:-}
      ODEV21_SUMMARY_STATS_PATH: ${ODEV21_SUMMARY_STATS_PATH:-}
      ODEV21_SUMMARY_STATS_SHA256: ${ODEV21_SUMMARY_STATS_SHA256:-}
      # 신규 사용자 평균 묶음(모델 파일처럼 /models/ode에 둔다). 경로가 비면 평균 계획 없음(503).
      ODEV21_POPULATION_BUNDLE_PATH: ${ODEV21_POPULATION_BUNDLE_PATH:-}
      ODEV21_POPULATION_BUNDLE_SHA256: ${ODEV21_POPULATION_BUNDLE_SHA256:-}
      PERSONAL_PLAN_POPULATION_MODE: "${PERSONAL_PLAN_POPULATION_MODE:-median_bundle}"
      ODEV21_VARIANT: ${ODEV21_VARIANT:-}
      ODEV21_DEVICE: ${ODEV21_DEVICE:-cpu}
      ODEV21_TORCH_THREADS: "${ODEV21_TORCH_THREADS:-1}"
      ODEV21_WARMUP_ENABLED: "${ODEV21_WARMUP_ENABLED:-true}"
      ODEV21_VALIDATED_HORIZON_SEC: "${ODEV21_VALIDATED_HORIZON_SEC:-5400}"
      # 앱에서 읽는 선택 기능. 그룹 공동 페이스는 배포 설정에서 켬, false로 끌 수 있음.
      ODE_PREVIEW_ENABLED: "${ODE_PREVIEW_ENABLED:-false}"
      DECIDE_FORECAST_ENABLED: "${DECIDE_FORECAST_ENABLED:-false}"
      GROUP_PACE_ENABLED: "${GROUP_PACE_ENABLED:-true}"
      # 자유러닝 경사 처리: reject(팀 기존 계약) | unknown | flat0(기본값, 0% 평지)
      FREE_RUN_GRADE_POLICY: "${FREE_RUN_GRADE_POLICY:-flat0}"
      # 개인 계획: 팀 DB 읽기 전용 접속(비우면 503 NOT_READY)과 실험 기능 스위치. 값은 배포 환경에서만 준다.
      AI_DB_URL: ${AI_DB_URL:-}
      GRU_PERSONALIZATION_ENABLED: "${GRU_PERSONALIZATION_ENABLED:-false}"
      GRU_PERSONALIZATION_MAX_WINDOWS: "${GRU_PERSONALIZATION_MAX_WINDOWS:-2000}"
      GRU_PERSONALIZATION_CACHE_TTL_SEC: "${GRU_PERSONALIZATION_CACHE_TTL_SEC:-300}"
      GRU_PERSONALIZATION_EMPTY_CACHE_TTL_SEC: "${GRU_PERSONALIZATION_EMPTY_CACHE_TTL_SEC:-60}"
      GRU_PERSONALIZATION_CACHE_MAX_USERS: "${GRU_PERSONALIZATION_CACHE_MAX_USERS:-1024}"
      GRU_PERSONALIZATION_DB_TIMEOUT_MS: "${GRU_PERSONALIZATION_DB_TIMEOUT_MS:-300}"
      # ODE식 GRU 개인 g·b(S15P31E105-641): AI06이 summaryU에 저장, AI04·AI10이 기준선 행에서 읽어 적용.
      # 코드 기본값은 꺼짐이고 배포 기본값은 켬(641 게이트 통과). 끄려면 GRU_GB_PERSONALIZATION_ENABLED=false.
      GRU_GB_PERSONALIZATION_ENABLED: "${GRU_GB_PERSONALIZATION_ENABLED:-true}"
      GRU_GB_MAX_WINDOWS: "${GRU_GB_MAX_WINDOWS:-3000}"
      # 준비도 민감도 c(S15P31E105-676): 준비도 낮은 날 허용 심박을 조금 낮춤(daily_readiness 읽기). 기본 꺼짐, 켜기는 팀 결정.
      READINESS_ADJUST_ENABLED: "${READINESS_ADJUST_ENABLED:-false}"
      # 무거운 요청 대기열 두 줄: 계획(AI05·AI09)과 개인화(AI06). 대기 한도는 공통.
      HEAVY_MAX_CONCURRENCY: "${HEAVY_MAX_CONCURRENCY:-1}"
      HEAVY_PERSONALIZE_MAX_CONCURRENCY: "${HEAVY_PERSONALIZE_MAX_CONCURRENCY:-1}"
      HEAVY_QUEUE_WAIT_SEC: "${HEAVY_QUEUE_WAIT_SEC:-30}"
      PERSONAL_PLAN_EXPERIMENTAL_ENABLED: "${PERSONAL_PLAN_EXPERIMENTAL_ENABLED:-false}"
      PERSONAL_PLAN_TARGET_HR_GLOBAL_RATIO: "${PERSONAL_PLAN_TARGET_HR_GLOBAL_RATIO:-0.9421864262333622}"
      PERSONAL_PLAN_TARGET_HR_K: "${PERSONAL_PLAN_TARGET_HR_K:-5}"
      PERSONAL_PLAN_TARGET_HR_HISTORY_SCALE: "${PERSONAL_PLAN_TARGET_HR_HISTORY_SCALE:-1.0126320246667229}"
      PERSONAL_PLAN_SEARCH_BUDGET_CELLS: "${PERSONAL_PLAN_SEARCH_BUDGET_CELLS:-70000}"
      PERSONAL_PLAN_RUNNER_BASELINE_ENABLED: "${PERSONAL_PLAN_RUNNER_BASELINE_ENABLED:-true}"
      PERSONAL_PLAN_RUNNER_BASELINE_K_TYPED: "${PERSONAL_PLAN_RUNNER_BASELINE_K_TYPED:-5}"
      PERSONAL_PLAN_RUNNER_BASELINE_K_LEVEL: "${PERSONAL_PLAN_RUNNER_BASELINE_K_LEVEL:-3}"
      PLAN_FIRST_SEGMENT_NO_FASTER_THAN_MEAN: "${PLAN_FIRST_SEGMENT_NO_FASTER_THAN_MEAN:-true}"
      PERSONAL_PLAN_SPEED_CALIB_SCALE: "${PERSONAL_PLAN_SPEED_CALIB_SCALE:-1.45}"
      PERSONAL_PLAN_SPEED_REF_DEFAULT_MPS: "${PERSONAL_PLAN_SPEED_REF_DEFAULT_MPS:-3.4704}"
      ODEV21_VALIDATION_REF: ${ODEV21_VALIDATION_REF:-}
      ODEV21_P4_LR: "${ODEV21_P4_LR:-0.03}"
      ODEV21_P4_LAMBDA: "${ODEV21_P4_LAMBDA:-1.0}"
      ODEV21_P4_STEPS: "${ODEV21_P4_STEPS:-100}"
      ODEV21_P4_WARM_START: "${ODEV21_P4_WARM_START:-1}"
      ODEV21_P4_WARM_STEPS: "${ODEV21_P4_WARM_STEPS:-20}"
      ODEV21_P4_EARLY_STOP_TOL: "${ODEV21_P4_EARLY_STOP_TOL:-0}"
      MPC_MARGIN_TABLE_PATH: ${MPC_MARGIN_TABLE_PATH:-}
      # MPC 시연 콘솔(AI07·AI10, /admin/demo/). 켜짐 + 토큰 둘(32자 이상) + 설정 경로가 모두 있어야 동작한다.
      # 값은 배포 .env에서만 주고, 설정 파일은 AI_MODEL_DIR 아래(/models/ode/...)에 둔다.
      DEMO_STREAM_ENABLED: "${DEMO_STREAM_ENABLED:-false}"
      DEMO_VIEW_TOKEN: ${DEMO_VIEW_TOKEN:-}
      DEMO_INGEST_TOKEN: ${DEMO_INGEST_TOKEN:-}
      DEMO_CONFIG_PATH: ${DEMO_CONFIG_PATH:-}
    # 실제 DB URL은 이미지·Compose 출력 대신 Secret 파일에서 읽는다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export AI_DB_URL="$$(cat /run/secrets/ai_db_url)"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    secrets:
      - ai_db_url
    networks:
      - default
      - database
    # GRU·ODE 동시 요청의 실제 최고 사용량을 확인한 뒤 조정한다.
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${AI_MODEL_FILE:?AI_MODEL_FILE is required}
        target: /models/gru_final.pt
        read_only: true
        bind:
          create_host_path: false
      # ODE는 같은 host 디렉터리에 두는 선택 기능이다. 파일이 없으면 GRU만 준비된다.
      - type: bind
        source: ${AI_MODEL_DIR:?AI_MODEL_DIR is required}
        target: /models/ode
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"

# 외부 포트 없이 이 네트워크에 연결한 컨테이너만 접근한다.
networks:
  default:
    internal: true
  database:
    external: true
    name: runway-db_default

secrets:
  ai_db_url:
    file: ${AI_DB_URL_FILE:?AI_DB_URL_FILE is required}
