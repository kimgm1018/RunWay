spring:
  application:
    name: runway-backend
  datasource:
    url: ${BACKEND_DB_URL:}
    username: ${BACKEND_DB_USERNAME:}
    password: ${BACKEND_DB_PASSWORD:}
    # DB 장애·잠금 경합 시 무한 대기 대신 정해진 시간 안에 503으로 응답한다(S15P31E105-294).
    # 값은 밀리초 정수다. 근거와 재정의 방법은 backend/README.md 환경변수 표를 따른다.
    hikari:
      connection-timeout: ${BACKEND_DB_CONNECTION_TIMEOUT_MS:5000}
      # HikariCP는 validation-timeout이 connection-timeout보다 작아야 한다.
      validation-timeout: 2000
      data-source-properties:
        # 연결 생성 시 서버 세션 설정으로 적용한다. 트랜잭션의 SET LOCAL lock_timeout이 이 값보다 우선한다.
        options: "-c lock_timeout=${BACKEND_DB_LOCK_TIMEOUT_MS:5000} -c statement_timeout=${BACKEND_DB_STATEMENT_TIMEOUT_MS:10000}"
        # DB 무응답·네트워크 단절 시 서버의 statement_timeout은 전달되지 않으므로 클라이언트 소켓 읽기 상한(초)을 둔다.
        # statement_timeout보다 길게 두어 정상적인 쿼리 시간초과는 서버가 먼저 끊게 한다.
        socketTimeout: ${BACKEND_DB_SOCKET_TIMEOUT_S:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

runway:
  group-pace:
    enabled: ${BACKEND_GROUP_PACE_ENABLED:false}
    base-url: ${BACKEND_AI_BASE_URL:}
  places:
    enabled: ${BACKEND_PLACE_SEARCH_ENABLED:false}
    search-client-id: ${BACKEND_NAVER_SEARCH_CLIENT_ID:}
    search-client-secret: ${BACKEND_NAVER_SEARCH_CLIENT_SECRET:}
    maps-key-id: ${BACKEND_NAVER_MAPS_KEY_ID:}
    maps-key: ${BACKEND_NAVER_MAPS_KEY:}
  sms:
    # 휴대전화 인증 SMS(SOLAPI, users.md U28). 끄면 발송하지 않고 503 SMS_UNAVAILABLE.
    enabled: ${BACKEND_SMS_VERIFICATION_ENABLED:false}
    solapi:
      api-key: ${BACKEND_SOLAPI_API_KEY:}
      api-secret: ${BACKEND_SOLAPI_API_SECRET:}
      sender-number: ${BACKEND_SOLAPI_SENDER_NUMBER:}
  push:
    # 앱 밖 푸시(FCM HTTP v1, ADR-0025). 끄면 발송하지 않고 알림 행은 PENDING으로 남는다(알림함은 그대로 동작).
    enabled: ${BACKEND_PUSH_ENABLED:false}
    # Firebase 서비스 계정 JSON 전체를 base64로 인코딩한 값. 서버에 평문 키 파일을 두지 않는다.
    service-account-base64: ${BACKEND_FCM_SERVICE_ACCOUNT_BASE64:}
  auth:
    trusted-proxies: ${BACKEND_AUTH_TRUSTED_PROXIES:}
    signup:
      # 개발·테스트 전용. true일 때만 휴대전화 인증 증명 없이 가입을 허용한다(users.md U15). 운영은 false.
      unverified-phone-allowed: ${BACKEND_SIGNUP_UNVERIFIED_PHONE_ALLOWED:false}
    redis:
      host: ${BACKEND_REDIS_HOST:}
      port: ${BACKEND_REDIS_PORT:}
      username: ${BACKEND_REDIS_USERNAME:}
      password: ${BACKEND_REDIS_PASSWORD:}
      ssl-enabled: ${BACKEND_REDIS_SSL_ENABLED:false}
  security:
    jwt-secret-base64: ${BACKEND_JWT_SECRET_BASE64:}
    docs-access-mode: ${BACKEND_DOCS_ACCESS_MODE:password}
    docs-username: ${BACKEND_DOCS_USERNAME:}
    docs-password-hash: ${BACKEND_DOCS_PASSWORD_HASH:}
  images:
    volume-path: ${BACKEND_IMAGE_VOLUME_PATH:data/images}
    max-bytes: 5242880
  # H08 기록 공유 링크(S15P31E105-704)의 공개 origin. 링크는 {base-url}/r/{token}이다. 경로·쿼리는 넣지 않는다.
  share:
    base-url: ${BACKEND_SHARE_BASE_URL:https://k15e105.p.ssafy.io}
  # C01 코스 생성(S15P31E105-423). 기본은 Route HTTP이며 주소가 비면 C01이 503 ROUTE_UNAVAILABLE이다.
  # stub은 개발자가 명시할 때만 쓰는 가짜 경로다. 시간 상한은 ai-service.md Route 계약 초안(연결 1초, 전체 15초, C01 20초)이다.
  course:
    generation-timeout: PT20S
    route:
      mode: ${BACKEND_ROUTE_MODE:http}
      base-url: ${BACKEND_ROUTE_BASE_URL:}
      connect-timeout: PT1S
      request-timeout: PT15S
    # 경사 계산용 DEM clip(GeoTIFF). 경로가 비거나 파일 해시가 맞지 않으면 C01이 503 GRADE_NOT_READY이다.
    # 기본 해시는 AI 팀이 공유한 부산 Copernicus GLO-30 clip(Route와 같은 파일)이다. 출처는 backend/README.md 9절.
    dem:
      path: ${BACKEND_COURSE_DEM_PATH:}
      sha256: ${BACKEND_COURSE_DEM_SHA256:45faaa5e36c710a235658e1172183279007ac3b3fdcc29a14246222fdabb3a1f}
  # 코스 썸네일(S15P31E105-612). 생성 코스 저장 커밋 후 비동기로 POST {course.route.base-url}/internal/v1/basemaps(detail full)를
  # 한 번 호출해 지형지물·건물을 받고, 서버가 평면 썸네일 PNG(600x900)를 그려 이미지 볼륨(runway.images.volume-path)에 저장한 뒤
  # course_basemaps에 키를 기록한다. Route 주소가 비면 기동은 하고 생성하지 않는다(C03 basemap은 null). 저장 이벤트의 실패는
  # 바로 다시 시도하지 않고(아래 일괄 채우기의 1회 재시도만 있음), 실패한 코스와 이전 그리기 버전으로 그린 코스는 다음 기동 때 일괄 채우기(ACTIVE 코스, 최대 backfill-limit개)가 다시 시도한다.
  # 일괄 채우기는 별도 스레드에서 GET {course.route.base-url}/internal/v1/ready(200, ready=true)를 ready-poll-interval마다
  # 확인하며 최대 ready-wait-timeout까지 기다린 뒤 넣는다. 그 안에 준비되지 않으면 이번 기동은 건너뛴다.
  # 실행기(스레드 1개)는 저장 이벤트를 남은 일괄 채우기보다 먼저 처리하고, 일괄 채우기 작업 사이에는 backfill-interval만큼 쉰다.
  # 일괄 채우기 중 Route가 잠깐 멈춘 실패(연결 실패·시간 초과·5xx)는 대기열이 빈 뒤 backfill-retry-delay를 기다려 한 번 더 시도한다.
  course-basemap:
    connect-timeout: PT1S
    request-timeout: PT15S
    max-response-bytes: 8388608
    backfill-on-startup: true
    backfill-limit: 500
    # S15P31E105-756: 기동 시 경로 썸네일이 없는 완료 기록을 최신순으로 넣는 상한. 0이면 기록 일괄 채우기를 하지 않는다.
    run-backfill-limit: 200
    backfill-interval: PT2S
    backfill-retry-delay: PT1M
    ready-poll-interval: PT10S
    ready-wait-timeout: PT10M
  # AI06 심박 개인화(S15P31E105-410). 러닝 종료 커밋 후 비동기로 POST {base-url}/v1/hr/personalize를 호출한다.
  # 주소가 비면 서버는 기동하고 호출만 실패한다(저장 없음). 503 AI_BUSY만 Retry-After(상한 30초)로 최대 3회 재시도한다.
  ai:
    hr:
      # HR 추론 서버 주소는 AI04 실시간 코칭과 같은 BACKEND_AI_BASE_URL 하나로 받는다(S15P31E105-421).
      base-url: ${BACKEND_AI_BASE_URL:}
      connect-timeout: PT1S
      request-timeout: PT60S
      max-retries: 3
      max-retry-after: PT30S
    # AI05 코스 지형 구간 난이도 비율(S15P31E105-297). 생성 코스 저장 커밋 후 비동기로 POST {base-url}/v1/pace/plan을 한 번 호출해
    # course_segment_difficulties에 저장한다. 주소가 비면 기동은 하고 계산하지 않는다(세션 계획은 균등 분배). 재시도는 없다.
    # 전체 상한 45초는 AI 계획 대기열 대기(HEAVY_QUEUE_WAIT_SEC 기본 30초)보다 길게 둔 값이다.
    pace-plan:
      base-url: ${BACKEND_AI_BASE_URL:}
      connect-timeout: PT1S
      request-timeout: PT45S
  # 실시간 코칭 AI04(S15P31E105-421). AI06과 같은 HR 추론 서버(ai/service)다. 주소가 비면 기동은 하고 AI 판단·자동 코칭을 하지 않는다(더미로 대체하지 않음).
  # 시간 상한은 ai-service.md N7-5(연결 1초, 전체 3초)이며 자동 재시도는 없다.
  coaching:
    ai:
      base-url: ${BACKEND_AI_BASE_URL:}
      connect-timeout: PT1S
      request-timeout: PT3S

springdoc:
  swagger-ui:
    persist-authorization: false

# 배포 검사는 컨테이너 내부에서만 접근한다. 업무 API 포트에는 노출하지 않는다.
management:
  server:
    address: 127.0.0.1
    port: 8082
  endpoints:
    access:
      default: none
    jmx:
      exposure:
        exclude: '*'
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    defaults:
      enabled: false
