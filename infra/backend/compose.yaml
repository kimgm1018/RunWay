name: runway-backend

services:
  backend:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      BACKEND_DB_URL: jdbc:postgresql://db:5432/runway
      BACKEND_DB_USERNAME: runway_app
      BACKEND_BIND_ADDRESS: 0.0.0.0
      BACKEND_PORT: "8080"
      # EC2 runway_service의 내부 대역. Nginx·백엔드만 연결하며 네트워크 재생성 시 확인한다.
      BACKEND_AUTH_TRUSTED_PROXIES: 172.18.0.0/16
      BACKEND_IMAGE_VOLUME_PATH: /data/images
      BACKEND_REDIS_HOST: redis
      BACKEND_REDIS_PORT: "6379"
      BACKEND_REDIS_USERNAME: runway_app
      BACKEND_REDIS_SSL_ENABLED: "false"
      BACKEND_ROUTE_MODE: http
      BACKEND_ROUTE_BASE_URL: http://route:8000
      BACKEND_DOCS_ACCESS_MODE: password
      BACKEND_DOCS_USERNAME: runway105
      # HR 추론 AI 서버(runway-ai 내부 네트워크의 ai 서비스). AI04 실시간 코칭(421)과 AI06 개인화(410)가 함께 쓴다.
      BACKEND_AI_BASE_URL: http://ai:8000
      # 그룹런 공동 페이스 AI10 S15P31E105-585/606, false면 기존 중앙값.
      BACKEND_GROUP_PACE_ENABLED: "true"
      # C01 경사 계산 DEM(S15P31E105-568). Route 전국 데이터 폴더의 전국 DEM을 읽기 전용으로 연결한다(601).
      # 파일을 바꾸면 아래 마운트 경로와 SHA를 함께 바꾼다. 불일치 시 C01만 503 GRADE_NOT_READY다. 되돌리기: 부산 clip(45faaa5e…).
      BACKEND_COURSE_DEM_PATH: /data/dem/copernicus_glo30_national.tif
      BACKEND_COURSE_DEM_SHA256: 21f8a77e60e409cfc252c2a22df8119ca822dc538b4d9aa8ca28858ff24920f2
      # 앱 밖 푸시(FCM, S15P31E105-815, ADR-0025). 서비스 계정 키는 아래 Secret 파일(base64 한 줄)에서 읽는다.
      # 끄려면 "false"로 바꾼다. 켠 상태에서 키가 비었거나 해석할 수 없으면 기동이 실패한다.
      BACKEND_PUSH_ENABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export BACKEND_DB_PASSWORD="$$(cat /run/secrets/db_app_password)"
        export BACKEND_JWT_SECRET_BASE64="$$(cat /run/secrets/jwt_secret_base64)"
        export BACKEND_DOCS_PASSWORD_HASH="$$(cat /run/secrets/docs_password_hash)"
        export BACKEND_REDIS_PASSWORD="$$(cat /run/secrets/redis_app_password)"
        export BACKEND_FCM_SERVICE_ACCOUNT_BASE64="$$(cat /run/secrets/fcm_service_account_base64)"
        # 고정된 환경변수만 읽고 파일 내용을 셸 코드로 실행하지 않는다.
        while IFS= read -r setting || [ -n "$$setting" ]; do
          case "$$setting" in
            BACKEND_PLACE_SEARCH_ENABLED=*|BACKEND_NAVER_SEARCH_CLIENT_ID=*|BACKEND_NAVER_SEARCH_CLIENT_SECRET=*|BACKEND_NAVER_MAPS_KEY_ID=*|BACKEND_NAVER_MAPS_KEY=*)
              export "$$setting"
              ;;
          esac
        done < /run/secrets/place_search_env
        exec java -jar /app/app.jar
    volumes:
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/place-search.env
        target: /run/secrets/place_search_env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/data/images
        target: /data/images
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/data/route_national/copernicus_glo30_national.tif
        target: /data/dem/copernicus_glo30_national.tif
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/redis-app-password
        target: /run/secrets/redis_app_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/db-app-password
        target: /run/secrets/db_app_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/jwt-secret-base64
        target: /run/secrets/jwt_secret_base64
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/docs-password-hash
        target: /run/secrets/docs_password_hash
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/ubuntu/runway/secrets/backend/fcm-service-account-base64
        target: /run/secrets/fcm_service_account_base64
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - route
      - redis
      - database
      - service
      - ai

networks:
  route:
    external: true
    name: runway-route_default
  redis:
    external: true
    name: runway_redis
  database:
    external: true
    name: runway-db_default
  service:
    external: true
    name: runway_service
  # AI 서버의 외부 포트 없는 내부 네트워크(infra/ai/compose.yaml). AI Compose를 먼저 실행해 네트워크를 만든다.
  ai:
    external: true
    name: runway-ai_default
