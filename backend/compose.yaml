name: runway-backend-local

services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME:?BACKEND_DB_NAME is required}
      POSTGRES_USER: ${BACKEND_DB_USERNAME:?BACKEND_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${BACKEND_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
